[project]
name = "aorc"
version = "0.1.0"
description = "Autonomous Orchestrated Repo Contributor — an unattended issue-to-PR pipeline driven by GitHub labels."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Real provider/GitHub SDKs live behind adapters (S1+). Kept optional so the
# orchestrator core and its tests run with zero third-party deps.
claude = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
github = ["PyGithub>=2.4"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aorc"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/aorc"]
branch = true

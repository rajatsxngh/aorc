[project]
name = "aorc"
version = "0.1.0"
description = "Autonomous Orchestrated Repo Contributor — an unattended issue-to-PR pipeline driven by GitHub labels."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aorc = "aorc.__main__:main"

[project.optional-dependencies]
# Real provider/GitHub SDKs live behind adapters (S1+). Kept optional so the
# orchestrator core and its tests run with zero third-party deps.
claude = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
github = ["PyGithub>=2.4"]
# App-JWT -> installation-token exchange (S23): RS256 signing only, kept
# separate from `github` since it's PyGithub-independent (plain stdlib
# urllib does the HTTP half -- see src/aorc/github/app_token.py).
apptoken = ["PyJWT[crypto]>=2.8"]
# ActionsContainerRuntime (S25): libsodium sealed-box encryption for the
# per-issue secret delivery path -- plain stdlib urllib does the HTTP half
# (see src/aorc/github/actions_runtime.py), so this is PyGithub-independent
# too.
actions = ["PyNaCl>=1.5"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aorc"]

[tool.pytest.ini_options]
minversion = "8.0"
# The default run is the zero-dep unit suite: integration tests (real SDKs,
# credentials, Docker daemon) are deselected here and selected explicitly in
# CI's integration job via `pytest -m integration tests/integration`
# (a command-line -m overrides this one).
addopts = "-ra -m 'not integration'"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: real-adapter smoke test; needs SDK extras + credentials/daemon, skips cleanly when absent",
]

[tool.coverage.run]
source = ["src/aorc"]
branch = true

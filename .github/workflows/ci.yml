# AORC CI (S19, +actionlint/actions extra S25): three jobs.
#
# - unit: the zero-dep suite; installs only [dev], integration tests are
#   deselected by the `-m "not integration"` in pyproject addopts.
# - integration: installs the real SDK extras, provisions credentials from
#   repo secrets/vars, and selects the integration marker explicitly. Every
#   integration test skips (never fails) when its credential/daemon is
#   absent, so the job stays green on forks and before secrets are
#   configured -- but with secrets set, the real adapters (Docker via the
#   daemon preinstalled on ubuntu-latest runners, the GitHub App exchange,
#   ActionsContainerRuntime) are exercised for real.
# - actionlint: static gate on the generated `aorc-rollback.yml` (S17/S18) so
#   a template edit can't silently break the YAML again (S25) -- catches
#   syntax/schema errors only, not the live revert/dispatch behavior, which
#   still needs a real sandbox exercise (see issues/25 for that open gap).
#
# Model names come from repo *vars*, never from code (invariant #2).

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Unit (zero-dep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (dev only, no SDK extras)
        run: python -m pip install -e ".[dev]"
      - name: Run unit suite
        run: pytest -q

  integration:
    name: Integration (real adapters)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with all SDK extras
        run: python -m pip install -e ".[dev,claude,openai,github,apptoken,actions]"
      - name: Run integration suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AORC_IT_CLAUDE_MODEL: ${{ vars.AORC_IT_CLAUDE_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AORC_IT_OPENAI_MODEL: ${{ vars.AORC_IT_OPENAI_MODEL }}
          # Throwaway repo the GitHub adapter tests may mutate.
          AORC_IT_GITHUB_TOKEN: ${{ secrets.AORC_IT_GITHUB_TOKEN }}
          AORC_IT_GITHUB_REPO: ${{ vars.AORC_IT_GITHUB_REPO }}
          # Optional: a pre-configured Projects v2 board for the column
          # round-trip, and the opt-in for the create_board test.
          AORC_IT_GITHUB_PROJECT_OWNER: ${{ vars.AORC_IT_GITHUB_PROJECT_OWNER }}
          AORC_IT_GITHUB_PROJECT_NUMBER: ${{ vars.AORC_IT_GITHUB_PROJECT_NUMBER }}
          AORC_IT_GITHUB_PROJECT_COLUMN: ${{ vars.AORC_IT_GITHUB_PROJECT_COLUMN }}
          AORC_IT_GITHUB_ALLOW_CREATE_PROJECT: ${{ vars.AORC_IT_GITHUB_ALLOW_CREATE_PROJECT }}
          AORC_IT_DOCKER_IMAGE: ${{ vars.AORC_IT_DOCKER_IMAGE }}
          # S25: a token with `actions: write` on AORC_IT_GITHUB_REPO, and a
          # workflow_dispatch-enabled workflow already on its default branch,
          # for ActionsContainerRuntime's dispatch/cancel round-trip.
          AORC_IT_GITHUB_WORKFLOW_FILE: ${{ vars.AORC_IT_GITHUB_WORKFLOW_FILE }}
        run: pytest -q -m integration tests/integration

  actionlint:
    name: actionlint (generated rollback workflow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (dev only -- rendering the template needs no SDK extras)
        run: python -m pip install -e ".[dev]"
      - name: Render the generated rollback workflow to a file
        run: |
          python -c "from aorc.install import ROLLBACK_WORKFLOW; open('/tmp/aorc-rollback.yml', 'w').write(ROLLBACK_WORKFLOW)"
      # actionlint's documented GitHub Actions usage: the official Docker
      # image, given explicit file paths so it lints the rendered template
      # rather than scanning this repo's own .github/workflows/.
      - name: actionlint
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color /tmp/aorc-rollback.yml
